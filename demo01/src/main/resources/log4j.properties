# Log4j 1.x 配置文件
# 根日志级别：INFO（只保留必要信息），Mapper 层单独开 DEBUG 以输出 SQL
log4j.rootLogger=INFO, stdout

# 控制台输出：日志统一灰色并带 [日志] 前缀，作为“执行过程”与业务结果区分
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.ImmediateFlush=true
log4j.appender.stdout.layout=com.example.util.ConsoleLogLayout
log4j.appender.stdout.layout.ConversionPattern=[\u65E5\u5FD7] %d{HH:mm:ss.SSS} %-5p %c{2} - %m%n

# MyBatis SQL 执行日志（mapper 接口包）
log4j.logger.com.example.mapper=DEBUG
